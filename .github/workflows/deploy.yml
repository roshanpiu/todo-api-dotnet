name: Deploy Todo API

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

# Required for OIDC authentication
permissions:
  id-token: write
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: func-todoapi-dev
  AZURE_RESOURCE_GROUP: rg-todoapi-dev
  DOTNET_VERSION: '8.0.x'
  WORKING_DIRECTORY: '.'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: dotnet restore
        working-directory: ${{ env.WORKING_DIRECTORY }}
      
      - name: Build
        run: dotnet build --configuration Release --no-restore
        working-directory: ${{ env.WORKING_DIRECTORY }}
      
      - name: Publish
        run: dotnet publish --configuration Release --output ./publish --no-build
        working-directory: ${{ env.WORKING_DIRECTORY }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: ${{ env.WORKING_DIRECTORY }}/publish
          if-no-files-found: error

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    
    outputs:
      functionAppName: ${{ steps.deploy.outputs.functionAppName }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Create Resource Group
        run: |
          az group create \
            --name ${{ env.AZURE_RESOURCE_GROUP }} \
            --location eastus \
            --output none || true
      
      - name: Deploy Bicep Template
        id: deploy
        run: |
          # Generate a random password for SQL
          SQL_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=' | head -c 20)
          SQL_PASSWORD="${SQL_PASSWORD}!Aa1"
          
          # Deploy infrastructure
          DEPLOYMENT_OUTPUT=$(az deployment group create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --template-file ./infra/main.bicep \
            --parameters environment=dev \
            --parameters appName=todoapi \
            --parameters sqlAdminPassword="$SQL_PASSWORD" \
            --query "properties.outputs" \
            --output json)
          
          # Extract function app name
          FUNCTION_APP_NAME=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.functionAppName.value')
          echo "functionAppName=$FUNCTION_APP_NAME" >> $GITHUB_OUTPUT
          echo "Function App Name: $FUNCTION_APP_NAME"

  deploy-application:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [build, deploy-infrastructure]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: function-app
          path: ./publish
      
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.deploy-infrastructure.outputs.functionAppName }}
          package: ./publish
      
      - name: Output Function App URL
        run: |
          echo "## Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Function App: ${{ needs.deploy-infrastructure.outputs.functionAppName }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### API Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- GET https://${{ needs.deploy-infrastructure.outputs.functionAppName }}.azurewebsites.net/todoitems" >> $GITHUB_STEP_SUMMARY
          echo "- POST https://${{ needs.deploy-infrastructure.outputs.functionAppName }}.azurewebsites.net/todoitems" >> $GITHUB_STEP_SUMMARY

